<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Overlay test</title>
<style>
body{font-family:sans-serif;margin:0}
.page{padding:20px}
.tall{height:3000px;background:linear-gradient(#fff,#cde)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;overflow-y:auto;padding:24px 16px}
.ov.open{display:block}
.box{background:#fff;border-radius:16px;min-height:1400px;padding:20px;max-width:600px;margin:0 auto;position:relative}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#333;color:#fff;border:0;font-size:18px}
button.t{font-size:18px;padding:12px;margin:6px}
</style></head><body>
<div class="page"><h2>Chrome iPad overlay test</h2>
<button class="t" onclick="openOv(0)">1: plain overlay</button>
<button class="t" onclick="openOv(1)">2: + html/body overflow hidden</button>
<button class="t" onclick="openOv(2)">3: + body position fixed</button>
<p>Scroll the page down a little first, then tap a button.</p></div>
<div class="tall"></div>
<div class="ov" id="ov"><div class="box"><button class="x" onclick="closeOv()">&times;</button>
<h3>Listing-like box</h3>
<p>Is the X visible with space above it? Is there a strip at the bottom of the screen? Does the page behind move when you swipe?</p>
<p style="margin-top:1200px">BOTTOM OF BOX</p></div></div>
<script>
var y=0;
function openOv(m){y=window.scrollY;
 if(m>=1){document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';}
 if(m>=2){document.body.style.position='fixed';document.body.style.top='-'+y+'px';document.body.style.left='0';document.body.style.right='0';}
 document.getElementById('ov').classList.add('open');}
function closeOv(){document.getElementById('ov').classList.remove('open');
 document.documentElement.style.overflow='';document.body.style.overflow='';
 document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';
 window.scrollTo(0,y);}
</script></body></html>
