<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bisect widget test</title>
<style>
html.t-lock,html.t-lock body{overflow:visible!important}
html.t-fixed #idx-widget-root .idx-map-overlay,html.t-fixed #idx-widget-root .idx-contact-overlay,html.t-fixed #idx-widget-root .idx-share-overlay,html.t-fixed #idx-widget-root .idx-print-overlay,html.t-fixed #idx-widget-root .idx-copied-overlay,html.t-fixed #idx-widget-root .idx-saved-panel,html.t-fixed #idx-widget-root .idx-saved-panel-overlay{display:none!important}
html.t-ov #idx-widget-root .idx-modal-overlay{scrollbar-width:auto!important}
html.t-ov #idx-widget-root .idx-modal-overlay.open{display:block!important}
html.t-ov #idx-widget-root .idx-modal{animation:none!important}
#ctl{padding:10px 14px;background:#111;color:#fff;font:16px/1.6 sans-serif}
#ctl label{display:block}
</style>
</head>
<body>
<div id="ctl">
<b>Pick ONE setting, then run a search, scroll down, and open listings:</b>
<label><input type="radio" name="t" value="" checked> 0 &ndash; Normal (nothing changed)</label>
<label><input type="radio" name="t" value="t-lock"> 1 &ndash; Page lock switched off</label>
<label><input type="radio" name="t" value="t-fixed"> 2 &ndash; Other fixed panels hidden</label>
<label><input type="radio" name="t" value="t-ov"> 3 &ndash; Plain overlay styling</label>
<label><input type="radio" name="t" value="sc-instant"> 4 &ndash; Search scroll made instant</label>
<label><input type="radio" name="t" value="sc-none"> 5 &ndash; Search scroll switched off</label>
</div>
<div id="idx-widget-root"
  data-api-key="MILE-CA-TEST-2026"
  data-agent-name="Your Name"
  data-agent-email="you@youremail.com"
  data-agent-phone="(416) 555-0199"
  data-agent-brokerage="Your Brokerage Inc."
  data-color-primary="#2D3748"
  data-color-accent="#D69E2E"
  data-country="CA">
</div>
<script>
(function(){var o=Element.prototype.scrollIntoView;
Element.prototype.scrollIntoView=function(a){var m=document.documentElement.dataset.sc;
 if(m==='none')return;
 if(m==='instant'&&a&&typeof a==='object')a=Object.assign({},a,{behavior:'auto'});
 return o.call(this,a);};})();
</script>
<script src="https://ca.youridx.com/widget.js?key=MILE-CA-TEST-2026&v=14"></script>
<script>
document.getElementById('ctl').addEventListener('change',function(e){
  var h=document.documentElement;
  ['t-lock','t-fixed','t-ov'].forEach(function(c){h.classList.remove(c);});
  if(e.target.value)h.classList.add(e.target.value);
});
</script>

<script>
(function(){var b=document.createElement('div');b.style.cssText='position:fixed;visibility:visible;left:6px;top:38%;z-index:2147483647;background:rgba(0,0,0,0.9);color:#ff0;font:bold 15px/1.45 monospace;padding:8px 10px;border:2px solid #ff0;border-radius:6px;pointer-events:none;white-space:pre';document.body.appendChild(b);
function u(){var v=window.visualViewport,o=document.getElementById('idxModalOverlay'),r=o&&o.classList.contains('open')?o.getBoundingClientRect():null,a=document.activeElement;
b.textContent=['iH '+innerHeight+'  vvH '+(v?v.height.toFixed(0):'-')+'  scale '+(v?v.scale.toFixed(2):'-'),'sY '+Math.round(scrollY)+'  docH '+document.documentElement.scrollHeight,'overlay '+(r?('top '+r.top.toFixed(0)+' h '+r.height.toFixed(0)):'closed'),'focus '+(a?a.tagName+'#'+(a.id||''):'-')].join('\n');}
setInterval(u,200);})();
</script>
<script>
document.getElementById('ctl').addEventListener('change',function(e){
  var h=document.documentElement;
  if(e.target.value==='sc-instant')h.dataset.sc='instant';
  else if(e.target.value==='sc-none')h.dataset.sc='none';
  else delete h.dataset.sc;
});
</script>
<style>
html.idx-cri-lock{background:#262626!important}
html.idx-cri-lock body{visibility:hidden!important;background:#262626!important}
html.idx-cri-lock #idx-widget-root .idx-modal-overlay.open,
html.idx-cri-lock #idx-widget-root .idx-saved-panel-overlay.open,
html.idx-cri-lock #idx-widget-root .idx-saved-panel.open{visibility:visible!important}
html.idx-cri-lock #idx-widget-root .idx-modal-overlay.open{background:#262626!important;padding-bottom:140px!important}
</style>

<script>
(function(){
  if(!/CriOS/.test(navigator.userAgent))return;
  var h=document.documentElement;
  function chk(){
    var any=document.querySelector('#idx-widget-root .idx-modal-overlay.open,#idx-widget-root .idx-saved-panel.open');
    h.classList.toggle('idx-cri-lock',!!any);
    requestAnimationFrame(chk);
  }
  requestAnimationFrame(chk);
})();
</script>

<script>
(function(){
  if(!/CriOS/.test(navigator.userAgent))return;
  var sel='#idx-widget-root .idx-modal-overlay.open,#idx-widget-root .idx-map-overlay.open,#idx-widget-root .idx-contact-overlay.open,#idx-widget-root .idx-share-overlay.open,#idx-widget-root .idx-print-overlay.open,#idx-widget-root .idx-copied-overlay.open';
  function fix(){
    document.querySelectorAll(sel).forEach(function(o){
      var t=parseFloat(o.dataset.fixT||'0');
      var natural=o.getBoundingClientRect().top-t;
      var need=Math.abs(natural)>1?-natural:0;
      if(Math.abs(need-t)>0.5){o.style.transform='translateY('+need+'px)';o.dataset.fixT=need;}
    });
    requestAnimationFrame(fix);
  }
  requestAnimationFrame(fix);
})();
</script>  
</body>
</html>
